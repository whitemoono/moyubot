services:
  landing:
    build: .
    image: moyubot-landing:latest
    container_name: moyubot-landing
    restart: unless-stopped
    ports:
      # Only reachable from the host (host nginx terminates TLS on :443 via SNI).
      - "127.0.0.1:8088:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

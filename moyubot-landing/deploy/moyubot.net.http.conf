# moyubot.net — port 80: ACME webroot + HTTPS redirect.
# default_server 444 keeps the host's stealth posture for unknown Hosts
# (this host only answers moyubot.net on port 80).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name moyubot.net;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://moyubot.net$request_uri;
    }
}

# moyubot.net — HTTPS on loopback 8443/8444; the public :443 stream listener
# forwards this SNI here (entry in /etc/nginx/stream.d/00-sni-map.conf).
# TLS is terminated here and proxied to the landing container (127.0.0.1:8088).
server {
    listen 127.0.0.1:8444 ssl http2;
    server_name moyubot.net;

    ssl_certificate     /etc/nginx/ssl/moyubot.net/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/moyubot.net/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
    }

    access_log /var/log/nginx/moyubot.net.access.log;
    error_log  /var/log/nginx/moyubot.net.error.log;
}

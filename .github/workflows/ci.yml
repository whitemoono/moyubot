name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      desktop_perf:
        description: Measure desktop startup and long-chat responsiveness
        type: boolean
        default: false
      desktop_perf_compare:
        description: Compare the desktop build against the pre-render-optimization baseline on one runner
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 纯 Node 那一层：216 条用例，ubuntu 与 windows 各跑一遍（windows 用来盯住路径/句柄类问题）
  node-tests:
    name: Node layer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      # @moyu/core 的 types 指向 dist/index.d.ts，干净 checkout 上必须先构建，
      # 否则 apps/desktop 的类型检查会因为找不到类型声明而失败。
      # apps/web/server 是独立的 npm 包（自带 package-lock），pnpm install 不会装它，
      # 而 pwa-execution 用例会 spawn 这个服务，所以单独装一次。
      - name: Install sync server deps
        run: npm ci --prefix apps/web/server --no-audit --no-fund
      - name: Build core
        run: pnpm --filter @moyu/core build
      # 有 4 个用例直接 require apps/desktop/dist-electron/*，干净 checkout 上要先编译主进程。
      - name: Build desktop main
        run: pnpm --filter @moyu/desktop build:main
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Unit tests (node layer)
        run: node scripts/test-all.mjs --layer=node
      - name: Code health ratchet
        run: node scripts/lint.mjs

  # 渲染层与 Electron 主进程能否编译打包
  build:
    name: Build desktop bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @moyu/core build
      - run: pnpm --filter @moyu/desktop build

  # 需要真实 Electron 运行时的端到端用例（串行跑：每个都拉起一套 Chromium）。
  # 这一层是唯一真正覆盖 IPC + 渲染层接线的测试，必须阻塞。
  electron-tests:
    name: Electron layer (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build core
        run: pnpm --filter @moyu/core build
      - name: Build desktop
        run: pnpm --filter @moyu/desktop build
      - name: Electron tests
        run: node scripts/test-all.mjs --layer=electron
      - name: Desktop request queue smoke
        timeout-minutes: 3
        run: pnpm --filter @moyu/desktop exec electron --no-sandbox ../../scripts/desktop-smoke.cjs --requests-only
      - name: Desktop performance baseline
        if: ${{ inputs.desktop_perf && !inputs.desktop_perf_compare }}
        timeout-minutes: 3
        run: pnpm --filter @moyu/desktop exec electron --no-sandbox ../../scripts/desktop-smoke.cjs --perf-only
      - name: Create the desktop performance reference worktree
        if: ${{ inputs.desktop_perf_compare }}
        run: |
          # 0e592f3 is the measured build before historical rows were isolated.
          $baseline = '0e592f38405ebc8560ec04adeecfd3d929aeeb71'
          git fetch --no-tags --deepen=20 origin refs/heads/codex/desktop-performance-ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The legacy avatar gitlink has no .gitmodules URL and is not used by the build.
          git -c submodule.recurse=false worktree add --detach .work/perf-baseline $baseline
      - name: Build the desktop performance reference
        if: ${{ inputs.desktop_perf_compare }}
        working-directory: .work/perf-baseline
        timeout-minutes: 8
        run: |
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm build
      - name: Compare desktop performance on one runner
        if: ${{ inputs.desktop_perf_compare }}
        timeout-minutes: 10
        run: node scripts/desktop-perf-compare.cjs .work/perf-baseline .

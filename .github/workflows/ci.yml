name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 纯 Node 那一层：216 条用例，ubuntu 与 windows 各跑一遍（windows 用来盯住路径/句柄类问题）
  node-tests:
    name: Node layer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      # @moyu/core 的 types 指向 dist/index.d.ts，干净 checkout 上必须先构建，
      # 否则 apps/desktop 的类型检查会因为找不到类型声明而失败。
      - name: Build core
        run: pnpm --filter @moyu/core build
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Unit tests (node layer)
        run: node scripts/test-all.mjs --layer=node
      - name: Code health ratchet
        run: node scripts/lint.mjs

  # 渲染层与 Electron 主进程能否编译打包
  build:
    name: Build desktop bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @moyu/core build
      - run: pnpm --filter @moyu/desktop build

  # 需要真实 Electron 运行时的 3 个端到端用例（串行跑：每个都拉起一套 Chromium）。
  # 这一层是唯一真正覆盖 IPC + 渲染层接线的测试，必须阻塞。
  electron-tests:
    name: Electron layer (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build core
        run: pnpm --filter @moyu/core build
      - name: Build desktop
        run: pnpm --filter @moyu/desktop build
      - name: Electron tests
        run: node scripts/test-all.mjs --layer=electron
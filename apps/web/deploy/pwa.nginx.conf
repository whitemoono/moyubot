# Existing host nginx: add this virtual host after issuing the certificate.
# If :443 is an nginx stream/SNI router, use a FREE loopback TLS port here,
# then map sync.example.com to that port in the existing stream configuration.
server {
    listen 80;
    server_name sync.example.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://sync.example.com$request_uri; }
}
server {
    listen 443 ssl;
    server_name sync.example.com;
    ssl_certificate /etc/nginx/ssl/sync.example.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/sync.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 4m;
    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 330s;
    }
}


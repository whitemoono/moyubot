# Standalone host only: public ports 80/443 must be available.
services:
  pwa:
    ports: !reset []
  https:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      PWA_DOMAIN: ${PWA_DOMAIN:?请在 .env 中设置你的域名}
    depends_on:
      pwa:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  caddy_data:
  caddy_config:
